apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: loadgenerator-workload
  namespace: default
spec:
  owner:
    componentName: loadgenerator
    projectName: traffic-sim
  container:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/loadgenerator:v0.10.5
    env:
    - key: FRONTEND_ADDR
      value: REPLACE-WITH-STOREFRONT-FRONTEND-ADDRESS
    - key: USERS
      value: '5'
