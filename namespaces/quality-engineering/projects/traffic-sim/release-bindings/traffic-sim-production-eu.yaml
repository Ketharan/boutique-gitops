# No `spec.projectRelease`. The pin is what promotion advances, and the CRD is
# explicit that it is nobody else's to reconcile: "A set pin is never touched by
# controllers — advancing it is left to whoever drives promotion (occ, GitOps,
# manual kubectl edit)." Commit a value here and Flux owns the field and reverts
# every promotion on its next reconcile.
#
# `spec.environment` is immutable once set, so these five names are a one-shot
# decision.
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: traffic-sim-production-eu
  namespace: quality-engineering
  labels:
    openchoreo.dev/project: traffic-sim
    openchoreo.dev/environment: production-eu
spec:
  owner:
    projectName: traffic-sim
  environment: production-eu
