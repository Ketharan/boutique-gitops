apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: loadgenerator
  namespace: boutique
spec:
  owner:
    projectName: traffic-sim
  componentType:
    kind: ClusterComponentType
    name: deployment/worker
  autoDeploy: true
  # Built from source, not a published tag. ClusterWorkflow rather than a namespaced
  # Workflow because this org unit uses the company-wide planes, which keeps every
  # reference cluster-scoped and the repository clone-able.
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/Ketharan/microservices-demo"
        revision:
          branch: "main"
        appPath: "/src"
      docker:
        context: "/src/loadgenerator"
        filePath: "/src/loadgenerator/Dockerfile"
