apiVersion: openchoreo.dev/v1alpha1
kind: Project
metadata:
  name: notifications
  namespace: boutique
  labels:
    openchoreo.dev/name: notifications
  annotations:
    # backstage.io/owner — GATED 2026-10-28. Commented out deliberately; do not
    # uncomment until the five Thunder IdP Groups exist.
    #
    # Applying it is HARMFUL today. It was applied live and reverted the same
    # day. This portal syncs Users and Groups from Thunder IdP, and the catalog
    # holds exactly one Group ("OpenChoreo Users"), so every entity ALREADY
    # carries a working owner reference — the provider builds one from its
    # configured default owner (OpenChoreoEntityProvider.ts). This line does not
    # ADD a reference, it REPOINTS one: eleven working refs become eleven
    # dangling refs and the catalog's missing-entity banner gets worse, not
    # better. Groups first, annotations second — never the other way round.
    # Unblocked by OPEN-ITEMS §C item 1.
    #
    # What it does once the Groups exist: propagates to the generated Backstage
    # entities' spec.owner. Resolution is component annotation > project
    # annotation > the portal's configured default (helpers.ts
    # resolveComponentOwner), so this one line owns every component in the
    # project unless a component overrides it. `default` is the BACKSTAGE
    # namespace, not the Kubernetes one.
    # backstage.io/owner: group:default/notifications
    openchoreo.dev/display-name: Notifications
    openchoreo.dev/description: Outbound messaging, shared by other projects
spec:
  deploymentPipelineRef:
    name: boutique
  type:
    kind: ClusterProjectType
    name: default
