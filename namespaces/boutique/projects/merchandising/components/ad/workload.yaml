apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: ad-workload
  namespace: boutique
spec:
  owner:
    componentName: ad
    projectName: merchandising
  endpoints:
    grpc:
      type: gRPC
      port: 9555
      visibility:
      - namespace
  container:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/adservice:v0.10.5
    env:
    - key: PORT
      value: '9555'
