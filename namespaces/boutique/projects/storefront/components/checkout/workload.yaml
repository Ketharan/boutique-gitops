apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: checkout-workload
  namespace: boutique
spec:
  owner:
    componentName: checkout
    projectName: storefront
  endpoints:
    grpc:
      type: gRPC
      port: 5050
  dependencies:
    endpoints:
    - project: storefront
      component: productcatalog
      name: grpc
      visibility: project
      envBindings:
        address: PRODUCT_CATALOG_SERVICE_ADDR
    - project: storefront
      component: shipping
      name: grpc
      visibility: project
      envBindings:
        address: SHIPPING_SERVICE_ADDR
    - project: storefront
      component: payment
      name: grpc
      visibility: project
      envBindings:
        address: PAYMENT_SERVICE_ADDR
    - project: notifications
      component: email
      name: grpc
      visibility: namespace
      envBindings:
        address: EMAIL_SERVICE_ADDR
    - project: storefront
      component: currency
      name: grpc
      visibility: project
      envBindings:
        address: CURRENCY_SERVICE_ADDR
    - project: storefront
      component: cart
      name: grpc
      visibility: project
      envBindings:
        address: CART_SERVICE_ADDR
  container:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/checkoutservice:v0.10.5
    env:
    - key: DISABLE_PROFILER
      value: '1'
    # OTLP tracing. This image reads COLLECTOR_SERVICE_ADDR (bare host:port,
    # gRPC) -- NOT OTEL_EXPORTER_OTLP_ENDPOINT, which it ignores silently.
    # Verified in the fork's source; the Python services default this to
    # localhost:4317, which is where the port and format come from.
    # Tracing is GATED: each of these images only calls its initTracing when
    # ENABLE_TRACING == "1". Without it COLLECTOR_SERVICE_ADDR is never even
    # read, and the service emits nothing with no error anywhere. Verified in
    # the fork across Go, JS and Python (e.g. frontend/main.go:113).
    # Without this the OTel SDK falls back to its default resource name and
    # every Go service reports as "unknown_service:server" — they all collide
    # under one name in the Traces view. The openchoreo.dev/component attribute
    # is correct either way; this is for anything keying on service.name.
    - key: OTEL_SERVICE_NAME
      value: checkout
    - key: ENABLE_TRACING
      value: '1'
    - key: COLLECTOR_SERVICE_ADDR
      value: opentelemetry-collector.openchoreo-observability-plane:4317
    - key: PORT
      value: '5050'
