apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: frontend
  namespace: boutique
spec:
  owner:
    projectName: storefront
  componentType:
    kind: ClusterComponentType
    name: deployment/web-application
  autoDeploy: true
  # Built from source, not a published tag. ClusterWorkflow rather than a namespaced
  # Workflow because this org unit uses the company-wide planes, which keeps every
  # reference cluster-scoped and the repository clone-able.
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/Ketharan/microservices-demo"
        revision:
          branch: "main"
        appPath: "/src"
      docker:
        context: "/src/frontend"
        filePath: "/src/frontend/Dockerfile"
  # API management on the public front door: rate limiting and response headers.
  #
  # WHY THIS COMPONENT AND NO OTHER. The trait attaches a TrafficPolicy to an
  # HTTPRoute, and only external-visibility endpoints generate one: project and
  # namespace visibility are service-to-service over direct service DNS, with no
  # route and so no target. This estate has exactly one HTTPRoute in development,
  # frontend's. checkout, productcatalog, cart and the rest cannot be targeted by
  # this module at all. frontend is not a preference, it is the only possibility
  # on the estate as it stands; business-portal joins it when pending/ ships, and
  # both are browser UIs.
  #
  # endpointName must match a key in this component's Workload endpoints. Its
  # endpoint key is `http` (workload.yaml), so this is `http`, not the port and
  # not the component name.
  #
  # jwt.enabled is set explicitly rather than left to the module default. This is
  # the shopper-facing web application and it must never require a token. If JWT
  # is ever wanted it belongs on something machine-to-machine, and that path has
  # not been request-tested end to end.
  #
  # THE LIMIT IS DELIBERATELY TEN TIMES THE MODULE DEFAULT, AND IT IS LINKED TO
  # THE TRAFFIC SIMULATOR. The module defaults to 60 tokens per 60s, i.e. 60
  # requests a minute. The simulator in the quality-engineering org unit runs
  # five Locust users against this endpoint, which alone sits around that figure
  # before a single real visitor arrives. At the default, the estate would throttle
  # its own demo traffic: the shopper journey would show 429s and the cell-diagram
  # edges would fail intermittently, reading as a fault rather than a feature.
  #
  # 600 per minute clears normal and simulated traffic with room to spare, and is
  # still trivially exceeded on purpose with a curl loop when the limit is what is
  # being demonstrated. Revisit this number if the simulator's USERS count changes;
  # see the FRONTEND_ADDR note in the loadgenerator's workload.yaml, which is the
  # other half of this pairing and the only other place the two are connected.
  #
  # AND BE CLEAR WHAT THIS NUMBER IS NOT. Rate limiting a browser UI is
  # illustrative, not realistic: the bucket counts every asset and XHR of a page
  # load, so one visitor browsing spends tokens many times faster than one caller
  # hitting an API would. 600 was chosen to avoid throttling a UI, NOT as a
  # sensible per-client API budget. Do not copy it onto a service and expect it to
  # mean the same thing.
  #
  # The response headers below are the half that demonstrates cleanly: visible on
  # `curl -I`, verifiable by anyone, and with no false-trip risk. X-OpenChoreo-Policy
  # names this trait instance, so the header alone tells a visitor which policy is
  # active and what to search the repository for. The other two are ordinary
  # security headers, which is what a real storefront would set.
  traits:
    # Arms the cart-cache incident, and it lives HERE rather than on `cart`
    # because this is the component that writes the signal.
    #
    # Measured during an induced redis outage on 2026-10-27: 73 "request error"
    # lines here in 55 seconds, against a threshold of 3 in 60. Comfortable.
    #
    # Every cart call is wrapped and reported through renderHTTPError
    # (frontend/handlers.go:536-538), which does
    # `log.WithField("error", err).Error("request error")`. The wrapper text is
    # the stable part: "could not retrieve cart" on the home, product and cart
    # pages (:74, :165, :261), with "failed to add to cart" on the add path and
    # "failed to complete the order" on checkout.
    #
    # cartservice logs the failure too — 432 lines in the same window, via the
    # ASP.NET gRPC error middleware — so a rule there would also match. This is
    # the better of two working options, not the only one.
    #
    # Keyed on the frontend's own wrapper rather than on cartservice's message,
    # because the wrapper is this component's text and does not depend on the
    # error propagating intact across the gRPC boundary.
    #
    # TWO RULES FOR WRITING THESE QUERIES, both learned by a rule silently
    # matching nothing:
    #
    # 1. NO APOSTROPHES. A query containing one returns zero through the
    #    observer's search path even when the text is indexed and findable by
    #    other searches. An earlier version of this rule used "Can't access cart
    #    storage" and matched nothing for that reason alone, while a search for
    #    "storage" returned 227 lines containing the exact phrase. Contractions
    #    are the usual way in. This query is apostrophe-free.
    #
    # 2. KEY ON TEXT THE COMPONENT ALWAYS EMITS FOR THE FAILURE CLASS, not on
    #    text that varies with the failure MODE. A deny policy produces
    #    RedisTimeoutException; a stopped service produces
    #    RedisConnectionException / UnableToConnect. Keying on either ties the
    #    rule to one break mechanism, so it passes the test we run and misses the
    #    failure we are modelling. "could not retrieve cart" is emitted on every
    #    cart read failure regardless of cause, which is the property that makes
    #    it a good alert rather than a good test assertion.
    #
    # This is also the better incident to show: "the storefront cannot retrieve
    # carts" is the user-visible symptom, which is what an RCA should start from.
    - kind: ClusterTrait
      name: observability-alert-rule
      instanceName: cart-cache-unreachable-alert
      parameters:
        description: "Alert when the storefront cannot retrieve shopper carts"
        severity: critical
        source:
          type: log
          query: "could not retrieve cart"
        condition:
          window: 1m
          interval: 1m
          operator: gt
          threshold: 3
    - kind: ClusterTrait
      name: kgateway-api-management
      instanceName: frontend-api-management
      parameters:
        endpointName: http
        jwt:
          enabled: false
        rateLimiting:
          enabled: true
          maxTokens: 600
          tokensPerFill: 600
          fillInterval: 60s
        addResponseHeaders:
          enabled: true
          headers:
            - name: X-OpenChoreo-Policy
              value: frontend-api-management
            - name: X-Content-Type-Options
              value: nosniff
            - name: X-Frame-Options
              value: SAMEORIGIN
