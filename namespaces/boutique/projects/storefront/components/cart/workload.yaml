apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: cart-workload
  namespace: boutique
spec:
  owner:
    componentName: cart
    projectName: storefront
  endpoints:
    grpc:
      type: gRPC
      port: 7070
  dependencies:
    resources:
    - ref: redis
      envBindings:
        connectionString: REDIS_ADDR
  container:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/cartservice:v0.10.5
    env:
    - key: PORT
      value: '7070'
