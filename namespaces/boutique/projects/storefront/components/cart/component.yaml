apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: cart
  namespace: boutique
spec:
  owner:
    projectName: storefront
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
  # Built from source, not a published tag. ClusterWorkflow rather than a namespaced
  # Workflow because this org unit uses the company-wide planes, which keeps every
  # reference cluster-scoped and the repository clone-able.
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/Ketharan/microservices-demo"
        revision:
          branch: "main"
        appPath: "/src"
      # cartservice is .NET and nests a level deeper than the other ten:
      # cartservice.sln sits at the service root with src/ and tests/ beneath it,
      # so the Dockerfile is at /src/cartservice/src, not /src/cartservice.
      docker:
        context: "/src/cartservice/src"
        filePath: "/src/cartservice/src/Dockerfile"
  # NO ALERT RULE HERE, DELIBERATELY — but not because this component is silent.
  # It is not: during an induced redis outage cartservice emitted 432 lines of
  # "Error status code 'FailedPrecondition' with detail 'Can't access cart
  # storage...'", written by the ASP.NET Core gRPC error middleware rather than
  # by the service's own code. A rule here WOULD match.
  #
  # The rule is on `frontend` because that is the better signal, not the only
  # one. Three reasons: the frontend logs the user-visible symptom ("could not
  # retrieve cart") rather than a cache-level detail, which is where an RCA
  # should start; it keys on its OWN wrapper text, so it does not depend on an
  # error message surviving the gRPC boundary intact; and the frontend is where
  # the traffic is, so the rule's threshold is met by the paths the simulator
  # actually drives. See frontend/component.yaml.
