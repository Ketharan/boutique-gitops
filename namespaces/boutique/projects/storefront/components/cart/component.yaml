apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: cart
  namespace: boutique
spec:
  owner:
    projectName: storefront
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
  # Built from source, not a published tag. ClusterWorkflow rather than a namespaced
  # Workflow because this org unit uses the company-wide planes, which keeps every
  # reference cluster-scoped and the repository clone-able.
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/Ketharan/microservices-demo"
        revision:
          branch: "main"
        appPath: "/src"
      # cartservice is .NET and nests a level deeper than the other ten:
      # cartservice.sln sits at the service root with src/ and tests/ beneath it,
      # so the Dockerfile is at /src/cartservice/src, not /src/cartservice.
      docker:
        context: "/src/cartservice/src"
        filePath: "/src/cartservice/src/Dockerfile"
  # NO ALERT RULE HERE, DELIBERATELY. The cart-cache incident is armed on
  # `frontend` instead, and the reason is worth keeping: cartservice does not
  # print its own failure. RedisCartStore wraps a store failure as
  # RpcException(FailedPrecondition, "Can't access cart storage. {ex}") and
  # THROWS it — the text travels to the gRPC client and is never written to
  # cartservice's stdout, so a log rule on this component can never match. The
  # frontend is the thing that logs it. See frontend/component.yaml.
