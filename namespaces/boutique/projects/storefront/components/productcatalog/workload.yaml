# `namespace`, not `internal`. Both are legal in the published-endpoint enum
# (project|namespace|internal|external), so the API server accepts either and a
# dry-run proves nothing here — unlike the four dependency refs that consume these,
# where the enum is project|namespace only and namespace is forced.
#
# namespace is "accessible across all projects in the same namespace and
# environment"; internal is "across all namespaces in the deployment"
# (api/v1alpha1/workload_types.go:107-111). This endpoint needs the first: its
# callers are in other boutique projects, inside the one org unit. internal would
# additionally expose it to `growth` and `platform`, which is wrong for a scenario
# whose point is project isolation, and would imply reach on the cell diagram that
# the design does not intend. A provider must also be at least as visible as the
# dependency consuming it, and that side is pinned to namespace — so internal here
# would be incoherent even though it validates.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: productcatalog-workload
  namespace: boutique
spec:
  owner:
    componentName: productcatalog
    projectName: storefront
  endpoints:
    grpc:
      type: gRPC
      port: 3550
      visibility:
      - namespace
  container:
    image: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice:v0.10.5
    env:
    - key: DISABLE_PROFILER
      value: '1'
    - key: PORT
      value: '3550'
