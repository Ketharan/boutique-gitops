# `spec.resourceRelease` intentionally unset — same rule as the project
# bindings: the pin belongs to whoever drives promotion, not to git.
apiVersion: openchoreo.dev/v1alpha1
kind: ResourceReleaseBinding
metadata:
  name: redis-staging-us
  namespace: boutique
spec:
  owner:
    projectName: storefront
    resourceName: redis
  environment: staging-us
  retainPolicy: Delete
