# `external` visibility, like storefront's frontend: this is the second front door,
# the one Business users arrive at. Port is this component's own choice — it is new
# code — so 8080 follows the repo's other web application rather than upstream.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: business-portal-workload
  namespace: boutique
spec:
  owner:
    componentName: business-portal
    projectName: insights
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility:
      - external
  dependencies:
    endpoints:
    - project: insights
      component: insights-api
      name: http
      visibility: project
      envBindings:
        address: INSIGHTS_API_ADDR
  container:
    image: host.k3d.internal:10082/boutique-insights-business-portal:v1-3676cf0d
    env:
    - key: PORT
      value: '8080'
