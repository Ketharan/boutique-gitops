# NOT APPLIED. This file sits under pending/ because the thing it describes does
# not exist yet — see pending/README.md for what unblocks it and the exact
# `git mv` that activates it. No Flux Kustomization points at pending/.
#
# "where someone types a question" — GCP-DEMO-IMPLEMENTATION.md 4.1. The diagram's
# `how are we doing?` edge arrives here from the Business users actor.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: business-portal
  namespace: boutique
spec:
  owner:
    projectName: insights
  componentType:
    kind: ClusterComponentType
    name: deployment/web-application
  autoDeploy: true
  # Built from source, not a published tag. ClusterWorkflow rather than a namespaced
  # Workflow because this org unit uses the company-wide planes, which keeps every
  # reference cluster-scoped and the repository clone-able.
  #
  # Without this block there is no build-from-source config at all: the component
  # would sit waiting for an image that nothing ever produces, with no error to
  # say why. Modelled on storefront/frontend's, which is the one known-good copy.
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/Ketharan/microservices-demo"
        revision:
          branch: "main"
        appPath: "/src"
      docker:
        context: "/src/business-portal"
        filePath: "/src/business-portal/Dockerfile"
