# Platform config for the quality-engineering org unit.
#
# Five Environments with the SAME names and the SAME cluster planes as boutique's,
# as separate objects, because the API offers no cross-namespace Environment
# reference. They are cluster-scoped plane references, which is the only reason a
# second org unit can share boutique-eu and boutique-us at all: DataPlaneRef has
# no namespace field, so a namespaced DataPlane is invisible from here.

---
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: development
  namespace: quality-engineering
  labels:
    openchoreo.dev/name: development
  annotations:
    openchoreo.dev/display-name: Development
    openchoreo.dev/description: Where builds land, run, and are observed first
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: company-wide
  isProduction: false

---
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: staging-eu
  namespace: quality-engineering
  labels:
    openchoreo.dev/name: staging-eu
  annotations:
    openchoreo.dev/display-name: Staging (EU, On Demand)
    openchoreo.dev/description: The European gate. Scales to zero when nobody is using it.
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: boutique-eu
  isProduction: false

---
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: staging-us
  namespace: quality-engineering
  labels:
    openchoreo.dev/name: staging-us
  annotations:
    openchoreo.dev/display-name: Staging (US, On Demand)
    openchoreo.dev/description: The North American gate. Scales to zero when nobody is using it.
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: boutique-us
  isProduction: false

---
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: production-eu
  namespace: quality-engineering
  labels:
    openchoreo.dev/name: production-eu
  annotations:
    openchoreo.dev/display-name: Production (EU, On Demand)
    openchoreo.dev/description: European traffic, kept in region for data residency. Parked on this host.
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: boutique-eu
  isProduction: true

---
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: production-us
  namespace: quality-engineering
  labels:
    openchoreo.dev/name: production-us
  annotations:
    openchoreo.dev/display-name: Production (US)
    openchoreo.dev/description: North American traffic and the analytics for it
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: boutique-us
  isProduction: true

---
# Mirrors boutique's graph. A separate object because DeploymentPipeline is
# namespace-scoped and deploymentPipelineRef carries no namespace.
apiVersion: openchoreo.dev/v1alpha1
kind: DeploymentPipeline
metadata:
  name: quality-engineering
  namespace: quality-engineering
  annotations:
    openchoreo.dev/display-name: Quality Engineering delivery
    openchoreo.dev/description: Development, a gate per region, then two independent regional productions
spec:
  promotionPaths:
    - sourceEnvironmentRef:
        kind: Environment
        name: development
      targetEnvironmentRefs:
        - kind: Environment
          name: staging-eu
        - kind: Environment
          name: staging-us
    - sourceEnvironmentRef:
        kind: Environment
        name: staging-eu
      targetEnvironmentRefs:
        - kind: Environment
          name: production-eu
    - sourceEnvironmentRef:
        kind: Environment
        name: staging-us
      targetEnvironmentRefs:
        - kind: Environment
          name: production-us
