# Platform config — the environments and the promotion graph.
#
# These belong in this repo and not in the installer: they embed nothing
# install-generated. An Environment names its data plane by string only.
# Plane OBJECTS are the opposite case and must never be committed anywhere —
# they carry the install's generated cluster-agent CA (minted per install,
# 90-day expiry). They are derived at install time; see read-only-setup/
# scripts/45-orgs.sh in openchoreo-distributions.
#
# Upstream models this same split and names this layer "platform config":
# openchoreo/openchoreo:samples/platform-config/{new-environments,
# new-deployment-pipeline}. The control-plane chart ships the Environment CRD
# and no Environment instance.
#
# PORTABILITY: `boutique-eu`, `boutique-us` and `company-wide` are showroom-
# specific plane names, and the only install-specific strings in this repo. All
# three are ClusterDataPlane references, which is the shape every upstream sample
# uses (ClusterDataPlane/default), so cloning this elsewhere means repointing five
# dataPlaneRef blocks at whatever cluster planes you have. See README.md.
#
# The regional two are cluster-scoped rather than namespaced for a reason that is
# not cosmetic: DataPlaneRef is {Kind, Name} with no namespace field
# (api/v1alpha1/types.go:121-129), and an unqualified reference resolves in the
# Environment's OWN namespace (environment_types.go:17). A namespaced
# DataPlane/boutique-eu is therefore invisible from any namespace but `boutique`,
# which would stop a second org unit from sharing the regional planes.

---
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: development
  namespace: boutique
  labels:
    openchoreo.dev/name: development
  annotations:
    openchoreo.dev/display-name: Development
    openchoreo.dev/description: Where builds land, run, and are observed first
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: company-wide
  isProduction: false

---
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: staging-eu
  namespace: boutique
  labels:
    openchoreo.dev/name: staging-eu
  annotations:
    openchoreo.dev/display-name: Staging (EU, On Demand)
    openchoreo.dev/description: The European gate. Scales to zero when nobody is using it.
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: boutique-eu
  isProduction: false

---
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: staging-us
  namespace: boutique
  labels:
    openchoreo.dev/name: staging-us
  annotations:
    openchoreo.dev/display-name: Staging (US, On Demand)
    openchoreo.dev/description: The North American gate. Scales to zero when nobody is using it.
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: boutique-us
  isProduction: false

---
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: production-eu
  namespace: boutique
  labels:
    openchoreo.dev/name: production-eu
  annotations:
    openchoreo.dev/display-name: Production (EU, On Demand)
    openchoreo.dev/description: European traffic, kept in region for data residency. Parked on this host.
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: boutique-eu
  isProduction: true

---
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: production-us
  namespace: boutique
  labels:
    openchoreo.dev/name: production-us
  annotations:
    openchoreo.dev/display-name: Production (US)
    openchoreo.dev/description: North American traffic and the analytics for it
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: boutique-us
  isProduction: true
