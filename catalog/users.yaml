# People, as Backstage catalog Users. Three per team, fifteen in all.
#
# Invented, role-shaped and on the reserved example.com domain. See
# catalog/groups.yaml for why these are display metadata and not identities.

---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: storefront-lead
  description: Lead on the Storefront team
spec:
  profile:
    displayName: Storefront Lead
    email: storefront-lead@boutique.example.com
  memberOf:
    - storefront

---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: storefront-engineer
  description: Engineer on the Storefront team
spec:
  profile:
    displayName: Storefront Engineer
    email: storefront-engineer@boutique.example.com
  memberOf:
    - storefront

---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
