apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: boutique-projects
  namespace: flux-system
spec:
  interval: 5m
  path: ./namespaces/default/projects
  prune: true
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: boutique-gitops
  dependsOn:
  - name: boutique-namespaces
